<style>
@media print{
  body *{ visibility:hidden; }
  #printArea, #printArea *{ visibility:visible; }
  #printArea{ position:absolute; top:0; left:0; width:100%; padding:24px; display:block !important; }
}
#printArea{ display:none; }
#printArea{ font-family:'Inter',system-ui,sans-serif; color:#111; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
#printArea .p-brand{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; color:#182422; }
#printArea .p-headline{ display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2.5px solid #182422; padding-bottom:10px; margin-bottom:4px; }
#printArea .p-headline .p-doctype{ font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:#D6291F; font-weight:700; }
#printArea h2{ font-family:'Space Grotesk',sans-serif; font-size:16px; margin:14px 0 2px; }
#printArea .p-sub{ font-size:11.5px; color:#555; margin-bottom:14px; }
#printArea .p-meta{ font-size:11px; color:#555; text-align:right; }
#printArea table{ width:100%; border-collapse:collapse; margin-bottom:16px; font-size:11.5px; }
#printArea thead th{ background:#182422; color:#fff; font-weight:600; padding:7px 8px; text-align:left; }
#printArea td{ border-bottom:1px solid #E2E2E2; padding:6px 8px; }
#printArea tbody tr:nth-child(even){ background:#F5F5F3; }
#printArea td.r, #printArea th.r{ text-align:right; }
#printArea .p-summary{ margin-top:6px; border:1.5px solid #182422; border-radius:6px; padding:12px 16px; max-width:320px; margin-left:auto; }
#printArea .p-summary div{ display:flex; justify-content:space-between; padding:3px 0; font-size:12.5px; }
#printArea .p-summary .final{ border-top:1px solid #182422; margin-top:4px; padding-top:6px; font-weight:700; font-size:14px; color:#D6291F; }
#printArea .p-footer{ margin-top:26px; font-size:9.5px; color:#999; text-align:center; border-top:1px solid #E2E2E2; padding-top:8px; }
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#0A0A0B;
  --surface:#17181A;
  --surface-2:#1E1F22;
  --header-bg:#000000;
  --ink:#F0F0EE;
  --ink-soft:#9A9CA0;
  --line:#2A2B2E;
  --line-strong:#3D3E42;
  --red:#E5352B;
  --red-dark:#B4241C;
  --silver:#C9CCCF;
  --silver-soft:#232427;
  --red-soft:#3A1414;
  --green:#3ECF7A;
  --green-soft:#123420;
  --radius:10px;
  --shadow:0 2px 10px rgba(0,0,0,0.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:70px;
}
.num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
h1,h2,h3{ font-family:'Space Grotesk',system-ui,sans-serif; margin:0; }

/* Header */
.app-header{
  background:var(--header-bg);
  color:#fff;
  padding:16px 16px 14px;
  position:sticky; top:0; z-index:20;
  border-bottom:1px solid #1C1C1E;
}
.app-header .title-row{
  display:flex; align-items:center; justify-content:space-between;
  max-width:900px; margin:0 auto;
}
.brand-row{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand-logo{ height:56px; width:auto; display:block; border-radius:4px; flex-shrink:0; }
.brand-text{ min-width:0; }
.brand-name{
  font-family:'Space Grotesk',system-ui,sans-serif; font-size:15px; font-weight:700;
  letter-spacing:0.06em; color:var(--silver); text-transform:uppercase;
}
.gear-btn{
  background:transparent; border:1px solid #2C2D2F; color:#B9BBBE;
  width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:15px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.gear-btn:active{ background:#1C1D1F; }
.total-box{ text-align:right; margin-left:auto; margin-right:12px; }
.total-box .total-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--green); }
.total-box .total-val{ font-weight:700; font-size:16px; margin-top:2px; }
.total-box .total-datetime{ font-size:13px; font-weight:700; color:var(--silver); margin-top:4px; font-family:'JetBrains Mono',monospace; letter-spacing:0.02em; }

/* Tabs */
.tabbar{
  display:flex; gap:6px; max-width:900px; margin:14px auto 0; padding:0 16px;
}
.tab-btn{
  flex:1; padding:9px 4px; border-radius:8px; border:1px solid transparent;
  background:#161617; color:#8A8C8F; font-family:'Space Grotesk',sans-serif;
  font-size:12.5px; font-weight:600; cursor:pointer; letter-spacing:0.01em;
}
.tab-btn.active{ background:var(--red); color:#fff; }

.wrap{ max-width:900px; margin:0 auto; padding:16px; }

/* Cards */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card h2{ font-size:14px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:12px; }

label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; font-weight:500; }
select, input[type=text], input[type=number], input[type=date]{
  width:100%; padding:9px 10px; border:1px solid var(--line-strong); border-radius:7px;
  font-size:14.5px; font-family:'Inter',sans-serif; background:var(--surface-2); color:var(--ink);
}
select:focus, input:focus{ outline:2px solid var(--red); outline-offset:1px; }
.field{ margin-bottom:10px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:520px){ .row2, .row3{ grid-template-columns:1fr; } }

.checkline{
  display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft);
  margin:6px 0 10px; user-select:none;
}
.checkline input{ width:16px; height:16px; }

.btn{
  border:none; border-radius:7px; padding:10px 16px; font-weight:600; font-size:13.5px;
  cursor:pointer; font-family:'Space Grotesk',sans-serif; letter-spacing:0.01em;
}
.btn-primary{ background:var(--red); color:#fff; }
.btn-primary:active{ background:var(--red-dark); }
.btn-secondary{ background:var(--silver-soft); color:var(--silver); }
.btn-block{ width:100%; }
.btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line-strong); }
.btn-danger-icon{
  background:transparent; border:none; color:var(--red); cursor:pointer; font-size:15px; padding:2px 6px;
}

/* Receipt / fiş strip */
.receipt{
  background:repeating-linear-gradient(var(--surface), var(--surface) 27px, #1D1E20 28px);
  border:1px dashed var(--line-strong); border-radius:8px;
  padding:14px 16px; margin-bottom:14px;
}
.receipt-row{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:3px 0; font-size:13.5px;
}
.receipt-row .lbl{ color:var(--ink-soft); }
.receipt-row .val{ font-weight:600; }
.receipt-row.total{ border-top:1px dashed var(--line-strong); margin-top:6px; padding-top:8px; font-size:16px; }
.val.debt{ color:var(--red); }
.val.paid{ color:var(--green); }

/* Table-like list */
.txn-list{ display:flex; flex-direction:column; gap:0; }
.txn-item{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:10px 0; border-bottom:1px solid var(--line);
}
.txn-item:last-child{ border-bottom:none; }
.txn-main{ flex:1; min-width:0; }
.txn-date{ font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.txn-desc{ font-size:14px; margin-top:1px; word-break:break-word; }
.txn-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.txn-amount{ text-align:right; white-space:nowrap; }
.txn-amount .big{ font-weight:700; font-size:14.5px; }
.txn-amount .small{ font-size:10.5px; color:var(--ink-soft); }

.empty-note{ color:var(--ink-soft); font-size:13px; text-align:center; padding:18px 6px; }

/* customer overview list */
.ov-item{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer;
}
.ov-item:last-child{ border-bottom:none; }
.ov-item:active{ background:var(--silver-soft); }
.ov-name{ font-weight:600; font-size:14px; }
.ov-sub{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
.ov-amt{ font-weight:700; font-size:14.5px; }
.pill{ font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600; }
.pill-red{ background:var(--red-soft); color:var(--red); }
.pill-green{ background:var(--green-soft); color:var(--green); }

.section-title{
  font-family:'Space Grotesk',sans-serif; font-size:12px; text-transform:uppercase;
  letter-spacing:0.06em; color:var(--ink-soft); margin:18px 0 8px 2px;
}
.month-group{ margin-bottom:14px; }
.month-head{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:12.5px; font-weight:700; color:var(--silver); padding:6px 0;
  border-bottom:1px solid var(--line-strong); margin-bottom:4px;
}

.back-link{
  display:inline-flex; align-items:center; gap:5px; color:var(--silver); font-size:13px;
  font-weight:600; cursor:pointer; margin-bottom:12px; background:none; border:none; padding:0;
  font-family:'Space Grotesk',sans-serif;
}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:flex-end;
  justify-content:center; z-index:50;
}
.modal{
  background:var(--surface); border:1px solid var(--line); width:100%; max-width:460px; border-radius:14px 14px 0 0; padding:20px;
  animation:slideup 0.18s ease-out; color:var(--ink);
}
@media (min-width:560px){
  .modal-backdrop{ align-items:center; }
  .modal{ border-radius:14px; }
}
@keyframes slideup{ from{ transform:translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
.modal h3{ font-size:15px; margin-bottom:14px; }
.modal-actions{ display:flex; gap:10px; margin-top:14px; }
.modal-actions .btn{ flex:1; }

.sync-note{ font-size:11px; color:var(--ink-soft); text-align:center; margin-top:4px; }

.toast{
  position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
  background:#1C1D1F; border:1px solid var(--line-strong); color:#fff; padding:9px 16px; border-radius:20px; font-size:12.5px;
  z-index:60; opacity:0; pointer-events:none; transition:opacity 0.25s;
}
.toast.show{ opacity:1; }

.add-customer-row{ display:flex; gap:8px; margin-top:8px; }
.add-customer-row input{ flex:1; }

.search-box{ position:relative; margin-bottom:12px; }
.search-box input{ padding-left:34px; }
.search-box .ico{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:14px; }
.export-row{ display:flex; gap:8px; margin-top:10px; }
.export-row .btn{ flex:1; }
</style>
</head>

function fmtDate(d){
  if(!d) return '-';
  const p = d.split('-');
  if(p.length!==3) return d;
  return p[2]+'.'+p[1]+'.'+p[0];
}
function monthLabel(d){
  const p = d.split('-');
  const aylar = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  return aylar[parseInt(p[1],10)-1] + ' ' + p[0];
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function updateClock(){
  const el = document.getElementById('totalDateTime');
  if(!el) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric' });
  const timeStr = now.toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  el.textContent = dateStr + ' · ' + timeStr;
}
updateClock();
setInterval(updateClock, 1000);

}

/* ================= CARİ DEFTER ================= */
function custTxns(cid){ return state.cari.transactions.filter(t=>t.customerId===cid).sort((a,b)=> b.date.localeCompare(a.date)); }
function custPays(cid){ return state.cari.payments.filter(p=>p.customerId===cid).sort((a,b)=> b.date.localeCompare(a.date)); }
function txnTotal(t){ return (t.fatura || t.kdvEkle) ? t.price * (1 + state.settings.kdvOrani/100) : t.price; }
function custDebtInfo(cid){
  const txns = custTxns(cid);
  const pays = custPays(cid);
  const toplamIs = txns.reduce((s,t)=>s+txnTotal(t),0);
  const toplamOdenen = pays.reduce((s,p)=>s+Number(p.amount),0);
  return { toplamIs, toplamOdenen, kalan: toplamIs - toplamOdenen };
}

    return `<div class="txn-item">

      </div>
      <div class="txn-amount">
        <div class="big num">${tl(txnTotal(t))}</div>

          <label>Müşteri</label>

        </div>
        <div class="field"><label>Yapılan İş</label><input type="text" name="desc" placeholder="Örn: Fren balatası değişimi" required></div>
        <div class="row3">
          <div class="field"><label>Süre (saat)</label><input type="number" step="0.25" name="hours" placeholder="Opsiyonel"></div>
          <div class="field"><label>Tarih</label><input type="date" name="date" value="${todayStr()}" required></div>
          <div class="field"><label>Fiyat</label><input type="number" step="0.01" name="price" required></div>
        </div>
        <label class="checkline"><input type="checkbox" name="fatura"> Fatura Kesildi (KDV otomatik %${state.settings.kdvOrani} eklenir)</label>
        <button class="btn btn-primary btn-block" type="submit">+ Kaydı Ekle</button>
      </form>
    </div>
    <div class="section-title">Son İşlemler</div>

function saveSatisIs(ev){
  ev.preventDefault();
  const f = ev.target;
  const custName = f.musteri.value.trim();
  if(!custName) return;
  let cu = state.cari.customers.find(c=> c.name.toLocaleLowerCase('tr-TR') === custName.toLocaleLowerCase('tr-TR'));
  if(!cu){ cu = { id: uid(), name: custName }; state.cari.customers.push(cu); }
  const fatura = f.fatura.checked;
  const t = {
    id: uid(), customerId: cu.id,
    date: f.date.value, desc: f.desc.value.trim(),
    hours: f.hours.value ? Number(f.hours.value) : null,
    price: Number(f.price.value),
    kdvEkle: fatura, fatura: fatura
  };
  state.cari.transactions.push(t);
  saveCari();
  render();
  showToast(fatura ? 'Kayıt eklendi (fatura kesildi)' : 'Kayıt eklendi');
}

function selectCustomer(id){ state.cari.selectedId = id; render(); }
function backToCustomerList(){ state.cari.selectedId = null; render(); }

async function exportCustomerExcel(customerId){
  const cust = state.cari.customers.find(x=>x.id===customerId);
  if(!cust) return;
  const txns = custTxns(customerId).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const pays = custPays(customerId).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const info = custDebtInfo(customerId);
  const isletme = state.settings.isletmeAdi || '';
  const INK = 'FF182422', COPPER = 'FFD6291F', LINE = 'FFD6DCD8', PAIDBG='FFE6F0E7', GREY='FFF5F5F3';
  const money = '#,##0.00 "₺"';

  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = isletme || cust.name;
    wb.created = new Date();

    // ---- Sheet 1: İş Kayıtları ----
    const ws = wb.addWorksheet('İş Kayıtları', { views:[{ showGridLines:false }] });
    ws.columns = [
      { width: 13 }, { width: 40 }, { width: 10 }, { width: 15 }, { width: 16 }, { width: 15 }
    ];
    ws.mergeCells('A1:F1');
    ws.getCell('A1').value = cust.name;
    ws.getCell('A1').font = { name:'Calibri', size:16, bold:true, color:{argb:INK} };
    ws.mergeCells('A2:F2');
    ws.getCell('A2').value = 'Cari Hesap Ekstresi' + (isletme? '  ·  ' + isletme : '');
    ws.getCell('A2').font = { name:'Calibri', size:12, bold:true, color:{argb:COPPER} };
    ws.mergeCells('A3:F3');
    ws.getCell('A3').value = 'Rapor Tarihi: ' + fmtDate(todayStr());
    ws.getCell('A3').font = { name:'Calibri', size:9, italic:true, color:{argb:'FF888888'} };
    ws.addRow([]);

    const headerRow = ws.addRow(['Tarih','Yapılan İş','Süre','Net Fiyat','Durum','Toplam Tutar']);
    headerRow.eachCell(c=>{
      c.font = { bold:true, color:{argb:'FFFFFFFF'} };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:INK} };
      c.alignment = { vertical:'middle' };
      c.border = { bottom:{style:'thin', color:{argb:INK}} };
    });

    txns.forEach((t,i)=>{
      const row = ws.addRow([
        fmtDate(t.date), t.desc, t.hours?(t.hours+' sa'):'-', t.price,
        (t.fatura?('Faturalı %'+state.settings.kdvOrani+' KDV') : (t.kdvEkle? 'KDV eklendi %'+state.settings.kdvOrani : 'KDV\'siz')),
        Number(txnTotal(t).toFixed(2))
      ]);
      row.getCell(4).numFmt = money;
      row.getCell(6).numFmt = money;
      row.getCell(6).font = { bold:true };
      if(i % 2 === 1){ row.eachCell(c=> c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:GREY} }); }
      row.eachCell(c=> c.border = { bottom:{style:'hair', color:{argb:LINE}} });
    });

    ws.addRow([]);
    const totRow = ws.addRow(['', '', '', '', 'Toplam İş Tutarı', Number(info.toplamIs.toFixed(2))]);
    totRow.getCell(5).font = { bold:true };
    totRow.getCell(6).font = { bold:true, size:12, color:{argb:COPPER} };
    totRow.getCell(6).numFmt = money;

    // ---- Sheet 2: Ödemeler ----
    const ws2 = wb.addWorksheet('Ödemeler', { views:[{ showGridLines:false }] });
    ws2.columns = [ { width:13 }, { width:40 }, { width:18 } ];
    ws2.mergeCells('A1:C1');
    ws2.getCell('A1').value = cust.name + ' — Ödeme Geçmişi' + (isletme? '  ·  ' + isletme : '');
    ws2.getCell('A1').font = { size:13, bold:true, color:{argb:INK} };
    ws2.addRow([]);
    const h2 = ws2.addRow(['Tarih','Açıklama','Tutar']);
    h2.eachCell(c=>{
      c.font = { bold:true, color:{argb:'FFFFFFFF'} };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:INK} };
    });
    pays.forEach((p,i)=>{
      const row = ws2.addRow([fmtDate(p.date), p.desc||'Ödeme', Number(p.amount.toFixed(2))]);
      row.getCell(3).numFmt = money;
      if(i%2===1) row.eachCell(c=> c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:GREY} });
    });
    ws2.addRow([]);
    const r1 = ws2.addRow(['','Toplam Ödenen', Number(info.toplamOdenen.toFixed(2))]);
    r1.getCell(2).font = { bold:true }; r1.getCell(3).font = { bold:true }; r1.getCell(3).numFmt = money;
    r1.eachCell(c=> c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:PAIDBG} });
    const r2 = ws2.addRow(['','Kalan Borç', Number(info.kalan.toFixed(2))]);
    r2.getCell(2).font = { bold:true, size:12 }; r2.getCell(3).font = { bold:true, size:12, color:{argb:COPPER} }; r2.getCell(3).numFmt = money;

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    saveAs(blob, cust.name.replace(/[^a-zA-Z0-9ığüşöçİĞÜŞÖÇ ]/g,'') + ' - cari hesap ekstresi.xlsx');
    showToast('Excel indirildi');
  }catch(e){
    console.error(e);
    showToast('Excel oluşturulamadı, tekrar deneyin');
  }
}

function printCustomer(customerId){

  const txns = custTxns(customerId).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const pays = custPays(customerId).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const info = custDebtInfo(customerId);
  const isletme = state.settings.isletmeAdi || '';

  let html = `
    <div class="p-headline">
      <div>
        <div class="p-brand">${escapeHtml(cust.name)}</div>
        <div class="p-doctype">Cari Hesap Ekstresi</div>
      </div>
      <div class="p-meta">
        ${isletme? `<div><strong>İşletme:</strong> ${escapeHtml(isletme)}</div>` : ''}
        <div>Rapor Tarihi: ${fmtDate(todayStr())}</div>
      </div>
    </div>

    <h2>Yapılan İşler</h2>
    <table><thead><tr>
      <th>Tarih</th><th>Yapılan İş</th><th>Süre</th><th class="r">Net Fiyat</th><th>Durum</th><th class="r">Toplam</th>

      html += `<tr><td>${fmtDate(t.date)}</td><td>${escapeHtml(t.desc)}</td><td>${t.hours?t.hours+' sa':'-'}</td><td class="r">${tl(t.price)}</td><td>${t.fatura?'Faturalı':((t.kdvEkle)?'KDV eklendi':'KDV\'siz')}</td><td class="r"><strong>${tl(txnTotal(t))}</strong></td></tr>`;
    });
  } else {
    html += `<tr><td colspan="6" style="text-align:center;color:#999;">Kayıt yok</td></tr>`;
  }
  html += `</tbody></table>

    <h2>Ödemeler</h2>
    <table><thead><tr><th>Tarih</th><th>Açıklama</th><th class="r">Tutar</th></tr></thead><tbody>`;
  if(pays.length){
    pays.forEach(p=>{
      html += `<tr><td>${fmtDate(p.date)}</td><td>${escapeHtml(p.desc||'Ödeme')}</td><td class="r">${tl(p.amount)}</td></tr>`;
    });
  } else {
    html += `<tr><td colspan="3" style="text-align:center;color:#999;">Kayıt yok</td></tr>`;
  }
  html += `</tbody></table>

    <div class="p-summary">
      <div><span>Toplam İş Tutarı</span><span>${tl(info.toplamIs)}</span></div>
      <div><span>Toplam Ödenen</span><span>${tl(info.toplamOdenen)}</span></div>

    <div class="p-footer">${isletme? escapeHtml(isletme)+' · ' : ''}${fmtDate(todayStr())}</div>
  `;

  document.getElementById('printArea').innerHTML = html;
  const oldTitle1 = document.title;
  document.title = cust.name;
  window.print();
  document.title = oldTitle1;
}

function toggleFatura(id){
  const t = state.cari.transactions.find(x=>x.id===id);
  if(!t) return;
  t.fatura = !t.fatura;
  if(t.fatura) t.kdvEkle = true;
  saveCari(); render();
  showToast(t.fatura ? 'Fatura kesildi olarak işaretlendi' : 'Fatura işareti kaldırıldı');
}
function deleteTxn(id){
  state.cari.transactions = state.cari.transactions.filter(t=>t.id!==id);
  saveCari(); render();
}
function confirmDeleteCustomer(id){
  const cust = state.cari.customers.find(x=>x.id===id);
  if(!cust) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Firmayı Sil</h3>
        <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 4px;">
          <strong>${escapeHtml(cust.name)}</strong> firmasını ve tüm iş kayıtlarını / ödemelerini kalıcı olarak silmek üzeresin. Bu işlem geri alınamaz.
        </p>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Vazgeç</button>
          <button class="btn btn-primary" style="background:var(--red)" onclick="deleteCustomerConfirmed('${id}')">Evet, Sil</button>
        </div>
      </div>
    </div>`;
}
function deleteCustomerConfirmed(id){
  state.cari.customers = state.cari.customers.filter(c=>c.id!==id);
  state.cari.transactions = state.cari.transactions.filter(t=>t.customerId!==id);
  state.cari.payments = state.cari.payments.filter(p=>p.customerId!==id);
  state.cari.selectedId = null;
  saveCari();
  closeModal();
  render();
  showToast('Firma silindi');
}
function addPayment(ev, customerId){
  ev.preventDefault();
  const f = ev.target;
  state.cari.payments.push({ id: uid(), customerId, date: f.date.value, amount: Number(f.amount.value), desc: f.desc.value.trim() });
  saveCari(); render();
  showToast('Ödeme kaydedildi');
}
function deletePayment(id){
  state.cari.payments = state.cari.payments.filter(p=>p.id!==id);
  saveCari(); render();
}

/* ================= ÖZET / BORÇLAR (ANALİZ TARZI) ================= */
function renderOzet(){
  const c = state.cari;
  if(c.selectedId) return renderCariDetailOnly();

  const term = (c.search||'').trim().toLocaleLowerCase('tr-TR');
  const filtered = term ? c.customers.filter(cu=> cu.name.toLocaleLowerCase('tr-TR').includes(term)) : c.customers;

  const withInfo = filtered.map(cu=>({ cu, info: custDebtInfo(cu.id) }));
  withInfo.sort((a,b)=> b.info.kalan - a.info.kalan);

  const toplamIs = c.customers.reduce((s,cu)=>s+custDebtInfo(cu.id).toplamIs,0);
  const toplamOdenen = c.customers.reduce((s,cu)=>s+custDebtInfo(cu.id).toplamOdenen,0);
  const toplamKalan = toplamIs - toplamOdenen;
  const maxKalan = Math.max(...withInfo.map(w=>Math.max(w.info.kalan,0)), 1);

  const kpiCards = [
    ['Toplam Firma', c.customers.length, false, 'var(--ink)'],
    ['Toplam İş Tutarı', toplamIs, true, 'var(--silver)'],
    ['Toplam Tahsilat', toplamOdenen, true, 'var(--green)'],
    ['Toplam Kalan Borç', toplamKalan, true, 'var(--red)']
  ].map(([label,val,isMoney,color])=>`
    <div style="flex:1 1 140px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);">
      <div style="font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">${label}</div>
      <div class="num" style="font-weight:700;font-size:17px;color:${color};">${isMoney?tl(val):val}</div>
    </div>`).join('');

  const rankRows = withInfo.length ? withInfo.map(({cu,info},i)=>{
    const pct = maxKalan>0 ? Math.round((Math.max(info.kalan,0)/maxKalan)*100) : 0;
    const isDebt = info.kalan > 0.004;
    const pillClass = isDebt ? 'pill-red' : 'pill-green';
    const pillText = isDebt ? 'BORÇLU' : 'TEMİZ';
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;" onclick="goToCustomerFromOzet('${cu.id}')">
      <div style="width:24px;height:24px;border-radius:50%;background:var(--silver);color:#111;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${i+1}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(cu.name)}</div>
        <div style="height:5px;background:var(--line);border-radius:3px;margin-top:5px;">
          <div style="height:100%;width:${pct}%;background:${isDebt?'var(--red)':'var(--green)'};border-radius:3px;"></div>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div class="num" style="font-weight:700;font-size:14px;color:${isDebt?'var(--red)':'var(--ink)'};">${tl(info.kalan)}</div>
        <span class="pill ${pillClass}" style="display:inline-block;margin-top:2px;">${pillText}</span>
      </div>
      <button class="btn-danger-icon" style="flex-shrink:0;" title="Firmayı sil" onclick="event.stopPropagation(); confirmDeleteCustomer('${cu.id}')">🗑</button>
    </div>`;
  }).join('') : (c.customers.length
      ? `<div class="empty-note">"${escapeHtml(c.search)}" ile eşleşen firma yok.</div>`
      : `<div class="empty-note">Henüz firma yok. Satış Ekle sekmesinden ilk kaydını gir.</div>`);

  return `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">${kpiCards}</div>

    <div class="search-box">
      <span class="ico">🔍</span>
      <input type="text" id="ozetSearchInput" placeholder="Firma ara…" value="${escapeHtml(c.search||'')}" oninput="setOzetSearch(this.value)">
    </div>

    <div class="card">
      <h2>Firma Bazlı Borç Durumu</h2>
      ${rankRows}
      ${c.customers.length ? `
      <div class="export-row" style="margin-top:14px;">
        <button class="btn btn-secondary" onclick="exportAllDebtsExcel()">📊 Tüm Firmalar — Excel</button>
        <button class="btn btn-ghost" onclick="printAllDebts()">🖨 Tüm Firmalar — PDF</button>
      </div>` : ''}
    </div>
  `;
}
function setOzetSearch(val){
  state.cari.search = val;
  render();
  const el = document.getElementById('ozetSearchInput');
  if(el){ el.focus(); const p = el.value.length; try{ el.setSelectionRange(p,p); }catch(e){} }
}
function goToCustomerFromOzet(id){
  state.cari.selectedId = id;
  render();
}

async function exportAllDebtsExcel(){
  const isletme = state.settings.isletmeAdi || '';
  const withInfo = state.cari.customers.map(cu=>({ cu, info: custDebtInfo(cu.id) }));
  withInfo.sort((a,b)=> b.info.kalan - a.info.kalan);
  const toplamIs = withInfo.reduce((s,w)=>s+w.info.toplamIs,0);
  const toplamOdenen = withInfo.reduce((s,w)=>s+w.info.toplamOdenen,0);
  const toplamKalan = toplamIs - toplamOdenen;
  const INK = 'FF182422', COPPER = 'FFD6291F', GREY='FFF5F5F3', REDBG='FF3A1414', GREENBG='FF12301F';
  const money = '#,##0.00 "₺"';

  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = isletme || 'Cari Hesap';
    wb.created = new Date();

    const ws = wb.addWorksheet('Firma Borç Özeti', { views:[{ showGridLines:false }] });
    ws.columns = [ { width:32 }, { width:16 }, { width:16 }, { width:16 }, { width:14 } ];
    ws.mergeCells('A1:E1');
    ws.getCell('A1').value = 'Tüm Firmalar — Borç Özeti';
    ws.getCell('A1').font = { name:'Calibri', size:16, bold:true, color:{argb:INK} };
    ws.mergeCells('A2:E2');
    ws.getCell('A2').value = (isletme ? isletme + '  ·  ' : '') + 'Rapor Tarihi: ' + fmtDate(todayStr());
    ws.getCell('A2').font = { name:'Calibri', size:10, italic:true, color:{argb:'FF888888'} };
    ws.addRow([]);

    const headerRow = ws.addRow(['Firma','Toplam İş Tutarı','Toplam Ödenen','Kalan Borç','Durum']);
    headerRow.eachCell(c=>{
      c.font = { bold:true, color:{argb:'FFFFFFFF'} };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:INK} };
    });

    withInfo.forEach((w,i)=>{
      const isDebt = w.info.kalan > 0.004;
      const row = ws.addRow([w.cu.name, Number(w.info.toplamIs.toFixed(2)), Number(w.info.toplamOdenen.toFixed(2)), Number(w.info.kalan.toFixed(2)), isDebt?'BORÇLU':'TEMİZ']);
      row.getCell(2).numFmt = money;
      row.getCell(3).numFmt = money;
      row.getCell(4).numFmt = money;
      row.getCell(4).font = { bold:true, color:{argb: isDebt? COPPER : 'FF3E7D50'} };
      row.getCell(5).font = { bold:true, color:{argb:'FFFFFFFF'} };
      row.getCell(5).fill = { type:'pattern', pattern:'solid', fgColor:{argb: isDebt? REDBG : GREENBG} };
      if(i % 2 === 1){ [1,2,3].forEach(ci=> row.getCell(ci).fill = { type:'pattern', pattern:'solid', fgColor:{argb:GREY} }); }
    });

    ws.addRow([]);
    const totRow = ws.addRow(['Genel Toplam', Number(toplamIs.toFixed(2)), Number(toplamOdenen.toFixed(2)), Number(toplamKalan.toFixed(2)), '']);
    totRow.font = { bold:true };
    totRow.getCell(2).numFmt = money;
    totRow.getCell(3).numFmt = money;
    totRow.getCell(4).numFmt = money;
    totRow.getCell(4).font = { bold:true, size:12, color:{argb:COPPER} };

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    saveAs(blob, 'Tum Firmalar - borc ozeti.xlsx');
    showToast('Excel indirildi');
  }catch(e){
    console.error(e);
    showToast('Excel oluşturulamadı, tekrar deneyin');
  }
}

/* ================= MALZEMECİLER (TEDARİKÇİ) ================= */
function supReceipts(sid){ return state.ted.receipts.filter(r=>r.supplierId===sid).sort((a,b)=> b.date.localeCompare(a.date)); }
function receiptTotal(r){ return r.kdvHaric ? r.amount * (1 + state.settings.kdvOrani/100) : r.amount; }
function supTotal(sid){ return supReceipts(sid).reduce((s,r)=>s+receiptTotal(r),0); }

function renderTed(){
  const t = state.ted;
  if(!t.selectedId){
    let rows = t.suppliers.map(s=>{
      const tot = supTotal(s.id);
      return `<div class="ov-item" onclick="selectSupplier('${s.id}')">
        <div>
          <div class="ov-name">${escapeHtml(s.name)}</div>
          <div class="ov-sub">${supReceipts(s.id).length} fiş</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <div class="ov-amt num">${tl(tot)}</div>
          <button class="btn-danger-icon" title="Malzemeciyi sil" onclick="event.stopPropagation(); confirmDeleteSupplier('${s.id}')">🗑</button>
        </div>
      </div>`;
    }).join('');
    if(!t.suppliers.length) rows = `<div class="empty-note">Henüz malzemeci eklemedin.</div>`;

    const genelToplam = t.suppliers.reduce((s,sup)=>s+supTotal(sup.id),0);

    return `
      <div class="receipt">
        <div class="receipt-row"><span class="lbl">Toplam Malzemeci</span><span class="val num">${t.suppliers.length}</span></div>
        <div class="receipt-row total"><span class="lbl">Toplam Alışveriş (KDV'li)</span><span class="val num">${tl(genelToplam)}</span></div>
      </div>

      <div class="card">
        <h2>Malzemeci Seç</h2>
        <div class="field">
          <select id="supplierPicker" onchange="handleSupplierPick(this.value)">
            <option value="">— Listeden seç —</option>
            ${t.suppliers.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}
            <option value="__new__">+ Yeni Malzemeci Ekle</option>
          </select>
        </div>
        <div id="newSupplierBox"></div>
      </div>

      <div class="section-title">Tüm Malzemeciler</div>
      <div class="card">${rows}</div>
    `;
  }

  const sup = t.suppliers.find(x=>x.id===t.selectedId);
  if(!sup){ t.selectedId=null; return renderTed(); }
  const receipts = supReceipts(sup.id);

  // group by month
  const groups = {};
  receipts.forEach(r=>{
    const key = r.date.slice(0,7);
    if(!groups[key]) groups[key] = [];
    groups[key].push(r);
  });
  const monthKeys = Object.keys(groups).sort((a,b)=> b.localeCompare(a));
  const monthHtml = monthKeys.length ? monthKeys.map(mk=>{
    const items = groups[mk];
    const subtotal = items.reduce((s,r)=>s+receiptTotal(r),0);
    const rowsHtml = items.map(r=>`
      <div class="txn-item">
        <div class="txn-main">
          <div class="txn-date">${fmtDate(r.date)}</div>
          <div class="txn-desc">${escapeHtml(r.desc || 'Fiş')}</div>
          <div class="txn-meta">${r.kdvHaric? '%'+state.settings.kdvOrani+' KDV eklendi' : 'KDV dahil girildi'}</div>
        </div>
        <div class="txn-amount">
          <div class="big num">${tl(receiptTotal(r))}</div>
          ${r.kdvHaric?`<div class="small num">net ${tl(r.amount)}</div>`:''}
        </div>
        <button class="btn-danger-icon" onclick="deleteReceipt('${r.id}')">✕</button>
      </div>`).join('');
    return `<div class="month-group">
      <div class="month-head"><span>${monthLabel(mk+'-01')}</span><span class="num">${tl(subtotal)}</span></div>
      ${rowsHtml}
    </div>`;
  }).join('') : `<div class="empty-note">Henüz fiş eklenmedi.</div>`;

  return `
    <button class="back-link" onclick="backToSupplierList()">← Tüm Malzemeciler</button>

    <div class="receipt">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;">${escapeHtml(sup.name)}</div>
        <button class="btn-danger-icon" style="font-size:12px;border:1px solid var(--red);border-radius:6px;padding:4px 8px;" onclick="confirmDeleteSupplier('${sup.id}')">🗑 Malzemeciyi Sil</button>
      </div>
      <div class="receipt-row total"><span class="lbl">Toplam Alışveriş (KDV'li)</span><span class="val num">${tl(supTotal(sup.id))}</span></div>
      <div class="export-row">
        <button class="btn btn-secondary" onclick="exportSupplierExcel('${sup.id}')">📊 Excel İndir</button>
        <button class="btn btn-ghost" onclick="printSupplier('${sup.id}')">🖨 PDF / Yazdır</button>
      </div>
    </div>

    <div class="card">
      <h2>Yeni Fiş Ekle</h2>
      <form onsubmit="addReceipt(event, '${sup.id}')">
        <div class="row2">
          <div class="field"><label>Tarih</label><input type="date" name="date" value="${todayStr()}" required></div>
          <div class="field"><label>Tutar</label><input type="number" step="0.01" name="amount" required></div>
        </div>
        <div class="field"><label>Açıklama (opsiyonel)</label><input type="text" name="desc" placeholder="Örn: Yağ filtresi, vida vs."></div>
        <label class="checkline"><input type="checkbox" name="kdvHaric"> Girdiğim tutar KDV hariç (üzerine %${state.settings.kdvOrani} eklensin)</label>
        <button class="btn btn-primary btn-block" type="submit">Fişi Kaydet</button>
      </form>
    </div>

    <div class="section-title">Fiş Geçmişi (Aylık)</div>
    ${monthHtml}
  `;
}

function handleSupplierPick(val){
  if(val === '__new__'){
    document.getElementById('newSupplierBox').innerHTML = `
      <div class="add-customer-row">
        <input type="text" id="newSupplierName" placeholder="Malzemeci adı" autofocus>
        <button class="btn btn-primary" onclick="addSupplier()">Ekle</button>
      </div>`;
    document.getElementById('newSupplierName').focus();
  } else if(val){
    selectSupplier(val);
  }
}
function addSupplier(){
  const input = document.getElementById('newSupplierName');
  const name = input.value.trim();
  if(!name){ showToast('Malzemeci adı giriniz'); return; }
  const id = uid();
  state.ted.suppliers.push({ id, name });
  state.ted.selectedId = id;
  saveTed(); render();
}
function selectSupplier(id){ state.ted.selectedId = id; render(); }
function backToSupplierList(){ state.ted.selectedId = null; render(); }

function addReceipt(ev, supplierId){
  ev.preventDefault();
  const f = ev.target;
  state.ted.receipts.push({
    id: uid(), supplierId, date: f.date.value,
    amount: Number(f.amount.value), desc: f.desc.value.trim(), kdvHaric: f.kdvHaric.checked
  });
  saveTed(); render();
  showToast('Fiş eklendi');
}
function deleteReceipt(id){
  state.ted.receipts = state.ted.receipts.filter(r=>r.id!==id);
  saveTed(); render();
}
function confirmDeleteSupplier(id){
  const sup = state.ted.suppliers.find(x=>x.id===id);
  if(!sup) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Malzemeciyi Sil</h3>
        <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 4px;">
          <strong>${escapeHtml(sup.name)}</strong> firmasını ve tüm fiş kayıtlarını kalıcı olarak silmek üzeresin. Bu işlem geri alınamaz.
        </p>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Vazgeç</button>
          <button class="btn btn-primary" style="background:var(--red)" onclick="deleteSupplierConfirmed('${id}')">Evet, Sil</button>
        </div>
      </div>
    </div>`;
}
function deleteSupplierConfirmed(id){
  state.ted.suppliers = state.ted.suppliers.filter(s=>s.id!==id);
  state.ted.receipts = state.ted.receipts.filter(r=>r.supplierId!==id);
  state.ted.selectedId = null;
  saveTed();
  closeModal();
  render();
  showToast('Malzemeci silindi');
}

  const toplam = supTotal(supplierId);
  const isletme = state.settings.isletmeAdi || '';
  const INK = 'FF182422', COPPER = 'FFD6291F', GREY='FFF5F5F3';
  const money = '#,##0.00 "₺"';

  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = isletme || sup.name;
    wb.created = new Date();

    const ws = wb.addWorksheet('Fişler', { views:[{ showGridLines:false }] });
    ws.columns = [ { width:13 }, { width:36 }, { width:16 }, { width:16 } ];
    ws.mergeCells('A1:D1');

    ws.mergeCells('A2:D2');
    ws.getCell('A2').value = 'Malzemeci Fiş Dökümü' + (isletme? '  ·  ' + isletme : '');
    ws.getCell('A2').font = { name:'Calibri', size:12, bold:true, color:{argb:COPPER} };
    ws.mergeCells('A3:D3');
    ws.getCell('A3').value = 'Rapor Tarihi: ' + fmtDate(todayStr());
    ws.getCell('A3').font = { name:'Calibri', size:9, italic:true, color:{argb:'FF888888'} };
    ws.addRow([]);

    const headerRow = ws.addRow(['Tarih','Açıklama','Durum','Tutar']);
    headerRow.eachCell(c=>{
      c.font = { bold:true, color:{argb:'FFFFFFFF'} };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:INK} };
      c.border = { bottom:{style:'thin', color:{argb:INK}} };
    });

    receipts.forEach((r,i)=>{
      const row = ws.addRow([
        fmtDate(r.date), r.desc || 'Fiş',
        r.kdvHaric ? ('KDV eklendi %'+state.settings.kdvOrani) : 'KDV dahil girildi',
        Number(receiptTotal(r).toFixed(2))
      ]);
      row.getCell(4).numFmt = money;
      row.getCell(4).font = { bold:true };
      if(i % 2 === 1){ row.eachCell(c=> c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:GREY} }); }
    });

    ws.addRow([]);
    const totRow = ws.addRow(['','','Toplam Alışveriş', Number(toplam.toFixed(2))]);
    totRow.getCell(3).font = { bold:true };
    totRow.getCell(4).font = { bold:true, size:12, color:{argb:COPPER} };
    totRow.getCell(4).numFmt = money;

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    saveAs(blob, sup.name.replace(/[^a-zA-Z0-9ığüşöçİĞÜŞÖÇ ]/g,'') + ' - fis dokumu.xlsx');
    showToast('Excel indirildi');
  }catch(e){
    console.error(e);
    showToast('Excel oluşturulamadı, tekrar deneyin');
  }
}

  let html = `
    <div class="p-headline">
      <div>
        <div class="p-brand">${escapeHtml(sup.name)}</div>
        <div class="p-doctype">Malzemeci Fiş Dökümü</div>
      </div>
      <div class="p-meta">
        ${isletme? `<div><strong>İşletme:</strong> ${escapeHtml(isletme)}</div>` : ''}
        <div>Rapor Tarihi: ${fmtDate(todayStr())}</div>
      </div>
    </div>

    <h2>Fişler</h2>
    <table><thead><tr>
      <th>Tarih</th><th>Açıklama</th><th>Durum</th><th class="r">Tutar</th>
    </tr></thead><tbody>`;
  if(receipts.length){
    receipts.forEach(r=>{
      html += `<tr><td>${fmtDate(r.date)}</td><td>${escapeHtml(r.desc||'Fiş')}</td><td>${r.kdvHaric?('KDV eklendi %'+state.settings.kdvOrani):'KDV dahil'}</td><td class="r"><strong>${tl(receiptTotal(r))}</strong></td></tr>`;
    });
  } else {
    html += `<tr><td colspan="4" style="text-align:center;color:#999;">Kayıt yok</td></tr>`;
  }
  html += `</tbody></table>

    <div class="p-summary">
      <div class="final"><span>Toplam Alışveriş</span><span>${tl(toplam)}</span></div>
    </div>

    <div class="p-footer">${isletme? escapeHtml(isletme)+' · ' : ''}${fmtDate(todayStr())}</div>
  `;

  document.getElementById('printArea').innerHTML = html;
  const oldTitle2 = document.title;
  document.title = sup.name;
  window.print();
  document.title = oldTitle2;
}

/* ================= GELİR - GİDER ================= */
function renderGG(){
  const entries = [...state.gg.entries].sort((a,b)=> b.date.localeCompare(a.date));
  const toplamGelir = state.gg.entries.filter(e=>e.type==='gelir').reduce((s,e)=>s+Number(e.amount),0);
  const toplamGider = state.gg.entries.filter(e=>e.type==='gider').reduce((s,e)=>s+Number(e.amount),0);
  const net = toplamGelir - toplamGider;

  // Aylık analiz — sadece bu sekmeye özel
  const aylikMap = {};
  state.gg.entries.forEach(e=>{
    const key = e.date.slice(0,7);
    if(!aylikMap[key]) aylikMap[key] = { gelir:0, gider:0 };
    if(e.type==='gelir') aylikMap[key].gelir += Number(e.amount);
    else aylikMap[key].gider += Number(e.amount);
  });
  const aylikKeys = Object.keys(aylikMap).sort((a,b)=> b.localeCompare(a));
  const aylikRows = aylikKeys.length ? aylikKeys.map(k=>{
    const m = aylikMap[k];
    const aynet = m.gelir - m.gider;
    return `<tr>
      <td style="padding:7px 8px;font-size:12.5px;">${monthLabel(k+'-01')}</td>
      <td class="num" style="padding:7px 8px;text-align:right;font-size:12.5px;color:var(--green);">${tl(m.gelir)}</td>
      <td class="num" style="padding:7px 8px;text-align:right;font-size:12.5px;color:var(--red);">${tl(m.gider)}</td>
      <td class="num" style="padding:7px 8px;text-align:right;font-size:12.5px;font-weight:700;color:${aynet>=0?'var(--green)':'var(--red)'};">${tl(aynet)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" style="padding:14px;text-align:center;color:var(--ink-soft);font-size:12.5px;">Henüz kayıt yok.</td></tr>`;

  const aylikTablo = `
    <div class="section-title">Aylık Özet</div>
    <div class="card" style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;min-width:420px;">
        <thead>
          <tr style="border-bottom:1px solid var(--line-strong);">
            <th style="padding:6px 8px;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);">Ay</th>
            <th style="padding:6px 8px;text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);">Gelen</th>
            <th style="padding:6px 8px;text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);">Giden</th>
            <th style="padding:6px 8px;text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);">Net</th>
          </tr>
        </thead>
        <tbody>${aylikRows}</tbody>
      </table>
      ${aylikKeys.length ? `
      <div style="display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;">
        <select id="ggAyPicker" style="flex:1;min-width:140px;">
          ${aylikKeys.map(k=>`<option value="${k}">${monthLabel(k+'-01')}</option>`).join('')}
        </select>
        <button class="btn btn-ghost" onclick="printGGMonth(document.getElementById('ggAyPicker').value)">🖨 Aylık PDF İndir</button>
      </div>` : ''}
    </div>
  `;

  const rows = entries.length ? entries.map(e=>`
    <div class="txn-item">
      <div class="txn-main">
        <div class="txn-date">${fmtDate(e.date)}</div>
        <div class="txn-desc">${escapeHtml(e.desc || (e.type==='gelir'?'Gelir':'Gider'))}</div>
      </div>
      <div class="txn-amount">
        <div class="big num" style="color:${e.type==='gelir'?'var(--green)':'var(--red)'}">${e.type==='gelir'?'+':'-'}${tl(e.amount)}</div>
      </div>
      <button class="btn-danger-icon" onclick="deleteGG('${e.id}')">✕</button>
    </div>`).join('') : `<div class="empty-note">Henüz kayıt yok.</div>`;

  return `
    <div class="receipt">
      <div class="receipt-row"><span class="lbl">Toplam Gelir</span><span class="val num paid">${tl(toplamGelir)}</span></div>
      <div class="receipt-row"><span class="lbl">Toplam Gider</span><span class="val num debt">${tl(toplamGider)}</span></div>
      <div class="receipt-row total"><span class="lbl">Net Bakiye</span><span class="val num" style="color:${net>=0?'var(--green)':'var(--red)'}">${tl(net)}</span></div>
    </div>

    ${aylikTablo}

    <div class="card">
      <h2>Yeni Kayıt</h2>
      <form onsubmit="addGG(event)">
        <div class="row2">
          <div class="field"><label>Tarih</label><input type="date" name="date" value="${todayStr()}" required></div>
          <div class="field"><label>Tür</label>
            <select name="type">
              <option value="gelir">Gelir</option>
              <option value="gider">Gider</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>Açıklama</label><input type="text" name="desc" placeholder="Opsiyonel"></div>
          <div class="field"><label>Tutar</label><input type="number" step="0.01" name="amount" required></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Kaydet</button>
      </form>
    </div>

    <div class="section-title">Kayıtlar</div>
    <div class="card"><div class="txn-list">${rows}</div></div>
  `;
}
function addGG(ev){
  ev.preventDefault();
  const f = ev.target;
  state.gg.entries.push({ id: uid(), date: f.date.value, type: f.type.value, desc: f.desc.value.trim(), amount: Number(f.amount.value) });
  saveGG(); render();
  showToast('Kayıt eklendi');
}
function deleteGG(id){
  state.gg.entries = state.gg.entries.filter(e=>e.id!==id);
  saveGG(); render();
}

function printGGMonth(monthKey){
  if(!monthKey) return;
  const isletme = state.settings.isletmeAdi || '';
  const entries = state.gg.entries
    .filter(e=> e.date.slice(0,7) === monthKey)
    .sort((a,b)=> a.date.localeCompare(b.date));
  const toplamGelir = entries.filter(e=>e.type==='gelir').reduce((s,e)=>s+Number(e.amount),0);
  const toplamGider = entries.filter(e=>e.type==='gider').reduce((s,e)=>s+Number(e.amount),0);
  const net = toplamGelir - toplamGider;

  let html = `
    <div class="p-headline">
      <div>
        <div class="p-brand">${escapeHtml(monthLabel(monthKey+'-01'))}</div>
        <div class="p-doctype">Gelir-Gider Dökümü (Gayriresmi)</div>
      </div>
      <div class="p-meta">
        ${isletme? `<div><strong>İşletme:</strong> ${escapeHtml(isletme)}</div>` : ''}
        <div>Rapor Tarihi: ${fmtDate(todayStr())}</div>
      </div>
    </div>

    <h2>Kayıtlar</h2>
    <table><thead><tr>
      <th>Tarih</th><th>Açıklama</th><th>Tür</th><th class="r">Tutar</th>
    </tr></thead><tbody>`;
  if(entries.length){
    entries.forEach(e=>{
      html += `<tr><td>${fmtDate(e.date)}</td><td>${escapeHtml(e.desc || (e.type==='gelir'?'Gelir':'Gider'))}</td><td>${e.type==='gelir'?'Gelir':'Gider'}</td><td class="r"><strong>${e.type==='gelir'?'+':'-'}${tl(e.amount)}</strong></td></tr>`;
    });
  } else {
    html += `<tr><td colspan="4" style="text-align:center;color:#999;">Bu ay kayıt yok</td></tr>`;
  }
  html += `</tbody></table>

    <div class="p-summary">
      <div><span>Toplam Gelen</span><span>${tl(toplamGelir)}</span></div>
      <div><span>Toplam Giden</span><span>${tl(toplamGider)}</span></div>
      <div class="final"><span>Net</span><span>${tl(net)}</span></div>
    </div>

    <div class="p-footer">${isletme? escapeHtml(isletme)+' · ' : ''}${fmtDate(todayStr())}</div>
  `;

  document.getElementById('printArea').innerHTML = html;
  const oldTitle3 = document.title;
  document.title = monthLabel(monthKey+'-01');
  window.print();
  document.title = oldTitle3;
}

/* ================= SETTINGS MODAL ================= */
function openSettings(){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Ayarlar</h3>
        <div class="field">
          <label>İşletme Adı (raporlarda görünür)</label>
          <input type="text" id="isletmeInput" value="${escapeHtml(state.settings.isletmeAdi||'')}" placeholder="Örn: Yılmaz Oto Servis">
        </div>
        <div class="field">
          <label>KDV Oranı (%)</label>
          <input type="number" id="kdvInput" value="${state.settings.kdvOrani}" step="1">
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Vazgeç</button>
          <button class="btn btn-primary" onclick="saveKdvSetting()">Kaydet</button>
        </div>
        <div style="text-align:center;font-size:10px;color:var(--ink-soft);margin-top:12px;">sürüm 4</div>
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function saveKdvSetting(){
  const v = Number(document.getElementById('kdvInput').value);
  if(!isNaN(v) && v >= 0){ state.settings.kdvOrani = v; }
  state.settings.isletmeAdi = document.getElementById('isletmeInput').value.trim();
  saveSettings();
  closeModal(); render();
  showToast('Ayarlar güncellendi');
}

/* ---------- UTIL ---------- */
function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
